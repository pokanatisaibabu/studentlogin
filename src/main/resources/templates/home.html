<title>Student Management System</title>

<style>

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        background: #f4f6f9;
    }

    /* Navigation Bar */

    .navbar {
        height: 70px;
        background: #172033;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 50px;
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
    }

    /* Logo */

    .logo {
        color: white;
        font-size: 23px;
        font-weight: bold;
        text-decoration: none;
    }

    .logo span {
        color: #4da6ff;
    }

    /* Navigation Links */

    .nav-links {
        display: flex;
        gap: 10px;
        list-style: none;
    }

    .nav-links a {
        color: #e8edf5;
        text-decoration: none;
        padding: 11px 18px;
        border-radius: 8px;
        font-size: 15px;
        transition: 0.3s;
    }

    .nav-links a:hover {
        background: #2d8cff;
        color: white;
        transform: translateY(-2px);
    }

    /* Different button for Delete */

    .nav-links .delete {
        color: #ff7b7b;
    }

    .nav-links .delete:hover {
        background: #dc3545;
        color: white;
    }

    /* Main Content */

    .container {
        max-width: 850px;
        margin: 45px auto;
        background: white;
        padding: 35px;
        border-radius: 15px;
        box-shadow: 0 5px 25px rgba(0, 0, 0, 0.08);
    }

    h1 {
        text-align: center;
        color: #172033;
        margin-bottom: 10px;
    }

    .subtitle {
        text-align: center;
        color: #777;
        margin-bottom: 30px;
    }

    /* Form */

    .form-group {
        margin-bottom: 18px;
    }

    label {
        display: block;
        font-weight: bold;
        margin-bottom: 7px;
        color: #333;
    }

    input {
        width: 100%;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 7px;
        font-size: 15px;
    }

    input:focus {
        outline: none;
        border-color: #2d8cff;
        box-shadow: 0 0 5px rgba(45, 140, 255, 0.3);
    }

    .submit-btn {
        width: 100%;
        padding: 13px;
        border: none;
        border-radius: 8px;
        background: #2d8cff;
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
    }

    .submit-btn:hover {
        background: #176dcc;
    }

    /* Mobile */

    @media (max-width: 800px) {

        .navbar {
            height: auto;
            padding: 15px 20px;
            flex-direction: column;
            gap: 15px;
        }

        .nav-links {
            flex-wrap: wrap;
            justify-content: center;
        }

        .container {
            margin: 25px 15px;
        }
    }

</style>
```

</head>

<body>

```
<!-- Navigation Bar -->

<nav class="navbar">

    <a href="/home" class="logo">
        🎓 Student<span>Hub</span>
    </a>

    <ul class="nav-links">

        <li>
            <a href="/home">Home</a>
        </li>

        <li>
            <a href="/update">✏ Update</a>
        </li>

        <li>
            <a href="/delete" class="delete">🗑 Delete</a>
        </li>

        <li>
            <a href="/get">🔍 Retrieve</a>
        </li>

        <li>
            <a href="/allStudentDetails">👥 All Students</a>
        </li>

    </ul>

</nav>


<!-- Main Student Form -->

<div class="container">

    <h1>Student Details</h1>

    <p class="subtitle">
        Add a new student to the Student Management System
    </p>


    <form action="/addStudent" method="post">


        <div class="form-group">

            <label>Name</label>

            <input type="text"
                   name="sname"
                   placeholder="Enter student name"
                   required>

        </div>


        <div class="form-group">

            <label>Roll No</label>

            <input type="number"
                   name="id"
                   min="1"
                   placeholder="Enter roll number"
                   required
                   oninvalid="this.setCustomValidity('Please enter a roll number greater than 0')"
                   oninput="this.setCustomValidity('')">

        </div>


        <div class="form-group">

            <label>CGPA</label>

            <input type="number"
                   name="cgpa"
                   min="0"
                   max="10"
                   step="0.01"
                   placeholder="Enter CGPA (0 - 10)"
                   required>

        </div>


        <div class="form-group">

            <label>College Email</label>

            <input type="email"
                   name="email"
                   placeholder="example@college.com"
                   required
                   oninvalid="this.setCustomValidity('Please enter a valid email address')"
                   oninput="this.setCustomValidity('')">

        </div>


        <div class="form-group">

            <label>Phone</label>

            <input type="tel"
                   name="phone"
                   pattern="[6-9][0-9]{9}"
                   maxlength="10"
                   minlength="10"
                   placeholder="Enter 10-digit phone number"
                   required
                   oninvalid="this.setCustomValidity('Please enter a valid 10-digit phone number')"
                   oninput="this.setCustomValidity('')">

        </div>


        <div class="form-group">

            <label>Department</label>

            <input type="text"
                   name="department"
                   placeholder="Enter department"
                   required>

        </div>


        <div class="form-group">

            <label>Year</label>

            <input type="number"
                   name="year"
                   min="1"
                   max="4"
                   placeholder="Enter year (1 - 4)"
                   required
                   oninvalid="this.setCustomValidity('Please enter a valid year between 1 and 4')"
                   oninput="this.setCustomValidity('')">

        </div>


        <input type="submit"
               value="Add Student"
               class="submit-btn">

    </form>

</div>
```

</body>

</html>
